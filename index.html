<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Generated by scripts/gen-favicons.mjs from scripts/assets/thinq-mark.svg; run
         `npm run favicons` after changing the mark rather than editing these.
         The tab icons are the bare mark on TRANSPARENCY — no plate behind it —
         and there are two of each: the silver-to-white gradient for a dark tab
         strip, the mark inked near-black #050505 for a light one.

         The `media` attributes below pick between them. Measured, not assumed:
         real Chrome under a dark system theme fetches favicon-dark.svg and no
         light variant, and under a light theme fetches favicon-light.svg — so
         `media` on `<link rel="icon">` is evaluated against the real theme.

         favicon.ico is deliberately NOT linked here, and that is the whole fix.
         It was linked, unconditionally and first, and Chrome painted IT — a
         black ring on a black tab strip in dark mode. `media` decides which
         files Chrome DOWNLOADS, not which one wins the tab: with the .ico
         declared, Chrome fetched favicon-dark.svg and favicon.ico and drew the
         .ico; with it gone, favicon-dark.svg is the only candidate it fetches,
         so it is the only thing it can draw. Measured both ways in real Chrome.

         The file still ships at /favicon.ico — browsers fall back to that path
         on their own without a <link>, which is what legacy clients use. Do not
         re-add the tag to "be safe": that is the bug.

         apple-touch-icon and the android pair stay OPAQUE #050505 (= --color-bg
         and theme-color below): iOS and Android mask and composite those
         themselves, and compositing transparency there yields a black plate we
         did not choose rather than one we did.

         Bump ?v= when the icon changes: browsers cache favicons far harder
         than they cache anything else, and a plain reload will not refresh one. -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="/favicon-dark.svg?v=14"
      media="(prefers-color-scheme: dark)"
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="/favicon-light.svg?v=14"
      media="(prefers-color-scheme: light)"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/favicon-32x32-dark.png?v=14"
      media="(prefers-color-scheme: dark)"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/favicon-32x32.png?v=14"
      media="(prefers-color-scheme: light)"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/favicon-16x16-dark.png?v=14"
      media="(prefers-color-scheme: dark)"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/favicon-16x16.png?v=14"
      media="(prefers-color-scheme: light)"
    />
    <!-- The one raster Google is meant to take, and the only <link> here with no
         `media`. Google supports BMP/GIF/ICO/PNG/JPEG/PPM/TIFF but NOT SVG, so
         the two SVGs above are invisible to it, and it documents no handling of
         `media` at all — which left it choosing between 16/32px PNGs behind
         media queries and the undeclared /favicon.ico. Its guidance asks for a
         square raster larger than 48x48; this is 96.

         Measured before adding it, because the note above warns that an
         unconditional raster link once stole the tab from the SVG: real Chrome,
         fresh profile, 3 runs per case, server-side request log. Light fetched
         only favicon-light.svg, dark only favicon-dark.svg, 18 of 18 runs. This
         file was never requested by Chrome in any of them — it cannot paint
         what it does not download. The earlier regression was an .ico, which
         Chrome ranks differently; a sized PNG loses to an SVG. -->
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png?v=14" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=14" />
    <link rel="manifest" href="/site.webmanifest?v=14" />
    <!-- The hero's still, not its clip. Preloading the video spent the first
         megabytes of a cold connection on an asset that may never be allowed to
         play — on a metered or slow link the ladder in src/lib/mediaTier.ts
         stops at this poster, and on a fast one the clip is fetched on its own
         once the poster is up. The poster is what the reader sees first either
         way, so it is the only media worth racing the page for. -->
    <link
      rel="preload"
      href="/clips/hero-backdrop-poster.webp"
      as="image"
      type="image/webp"
      fetchpriority="high"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Open to search engines. This replaced a pre-launch block that existed
         because the page carried a placeholder canonical and placeholder legal
         identity in the JSON-LD below, and an indexed copy would have outlived
         the draft it was taken from. Both now hold the registered entity's real
         details, taken from src/data/footer.ts, so the reason for the block is
         gone.

         The old value also suppressed the cached copy. That is deliberately not
         carried over: it existed to keep a cached draft out of results, and
         withholding the cached copy of a live page helps nobody.

         Paired with public/robots.txt, which has to agree with this line. -->
    <meta name="robots" content="index, follow" />
    <!-- Must track --color-bg in src/index.css (#050505) -->
    <meta name="theme-color" content="#050505" />
    <!-- The head now describes a waitlist, not a brokerage account, and every
         string below moved with the page. The old set sold "flat-fee pricing"
         and "open your demat account in minutes" — a share preview promising an
         account a visitor cannot yet open is a worse first impression than no
         preview, because it is the one part of the page a reader sees before
         they arrive. -->
    <meta
      name="description"
      content="Thinq is a trading terminal for Indian markets that watches every instrument you follow and writes what changed in plain English. Join the waitlist for six months of zero Thinq brokerage; statutory charges apply."
    />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Thinq — the chart tells you what just moved" />
    <meta
      property="og:description"
      content="A trading terminal for Indian markets, not yet open. Six months of zero Thinq brokerage for everyone on the waitlist; statutory charges apply."
    />
    <!-- Regenerate with `node scripts/gen-og.mjs` after changing hero copy; it
         reads every word from src/data/hero.ts so the card cannot claim what
         the page does not. The card this replaced was the old ThinqProfit
         artwork — purple, wrong brand name, selling a product that is not open,
         and asserting an MCX registration the page never claims.

         ABSOLUTE, and versioned. Scrapers are required to resolve og:image
         against the document, but several of the ones that matter — WhatsApp
         among them — are unreliable with a relative path, and every one of them
         caches the result hard. Bump ?v= whenever the card changes or the old
         one keeps being served for weeks. -->
    <meta property="og:url" content="https://thinq.co/" />
    <meta property="og:image" content="https://thinq.co/og-image.png?v=2" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Thinq — a trading terminal for Indian markets"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://thinq.co/og-image.png?v=2" />

    <!-- The homepage's canonical. `/terms` is served this same file by the
         SPA fallback, so it would otherwise inherit this value and tell a
         crawler it is a duplicate of the homepage; App.tsx rewrites the href
         per route to stop that. -->
    <link rel="canonical" href="https://thinq.co/" />
    <!-- Every value below is the registered entity's, taken from
         src/data/footer.ts, which is the same source the footer and the Terms
         page render from. A search engine reads structured data as fact, so
         nothing here is inferred or filled in for completeness:

           · `telephone` is omitted. footer.ts holds "+91 22 67827171 / 7172",
             which is two numbers on one line rather than the single value this
             field takes, and picking one of them would be a guess.
           · `sameAs` is omitted. No social accounts are recorded anywhere in
             the repository, and an empty array asserts nothing.
           · `addressRegion` is the one value not written literally in
             footer.ts. It is not a guess: the CIN there
             (U64990MH2006PTC165522) carries the MH state code and the GSTIN on
             the Terms page (27AAECM8621N1Z0) opens with 27, both of which are
             Maharashtra.
           · "Bandra (W)" sits in `streetAddress` rather than
             `addressLocality`, because schema.org reads locality as the city. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": ["Organization", "FinancialService"],
        "name": "Thinq",
        "legalName": "Money Logix Securities Pvt Ltd",
        "url": "https://thinq.co/",
        "email": "support@moneylogix.in",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "Vrindavan Annexe, 32 Mount Mary Road, Bandra (W)",
          "addressLocality": "Mumbai",
          "addressRegion": "Maharashtra",
          "postalCode": "400050",
          "addressCountry": "IN"
        }
      }
    </script>

    <!-- Google Fonts for ultra-premium typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Loaded without blocking the first paint. As a plain stylesheet this sat
         in front of every pixel on the page: on a 400kbps link it pushed first
         paint to 4.8s, which the reader spends looking at nothing. The
         `media="print"` swap lets the parser walk straight past it and applies
         it the moment it lands; `display=swap` in the URL already means the
         copy is readable in the fallback face until then. -->
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all';this.onload=null"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&display=swap"
        rel="stylesheet"
      />
    </noscript>

    <!-- The bare brand, by request. `og:title` above deliberately keeps the
         descriptive line: that one is the headline of a shared link preview,
         where "Thinq" alone would tell a reader nothing about what they are
         about to open. -->
    <title>Thinq</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
